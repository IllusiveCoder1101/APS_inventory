<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Arial', sans-serif; background-color: #f4f4f4; margin:0; padding:0; color:#333; }
    .container { max-width:600px; margin:30px auto; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    .header { background:#4CAF50; color:white; padding:20px; text-align:center; font-size:24px; font-weight:bold; }
    .content { padding:30px 20px; line-height:1.6; }
    .button { display:inline-block; padding:12px 25px; margin-top:20px; background:#4CAF50; color:white !important; text-decoration:none; font-weight:bold; border-radius:5px; }
    .footer { padding:20px; font-size:12px; color:#777; text-align:center; border-top:1px solid #eee; }
    @media only screen and (max-width:620px){ .container{width:90% !important;} .content{padding:20px 10px;} }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">{{ title }}</div>
    <div class="content">
      <p>Hi {{ recipient_name }},</p>
      <p>{{ message_body }}</p>
      {% if attachments %}
      <p>Attachments:</p>
      <ul>
      {% for file in attachments %}
        <li>{{ file }}</li>
      {% endfor %}
      </ul>
      {% endif %}
      <a class="button" href="{{ link }}">View Report</a>
    </div>
    <div class="footer">
      This is an automated message. Please do not reply.
    </div>
  </div>
</body>
</html>
